<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f7f5f0" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#14181a" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="英语教练" />
    <meta name="description" content="定级、生成计划、每天五个模块练一点，记录都留在自己设备里。" />
    <title>英语教练</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon-192.png" sizes="192x192" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <link rel="stylesheet" href="styles.css?v=12" />
  </head>
  <body>
    <div id="app"></div>
    <div id="toast" class="toast" aria-live="polite"></div>

    <script defer src="content.js?v=12"></script>
    <script defer src="engine.js?v=12"></script>
    <script defer src="asr.js?v=12"></script>
    <script type="module" src="app.js?v=12"></script>
    <script>
      // 装到主屏后要能离线打开，靠这个 Service Worker
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('sw.js').catch(() => {});
        });
      }
    </script>
  </body>
</html>
